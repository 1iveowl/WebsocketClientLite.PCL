name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    branches:
      - main
      - "releases/**"
  workflow_dispatch:

jobs:
  verify-protocol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Close requirement map and validator failure modes
        run: |
          python3 scripts/validate-requirements.py
          python3 -m unittest discover -s verification/tests -v
      - name: Verify protocol core and check generated C#
        run: |
          set -o pipefail
          ./scripts/dafny-masking.sh --check 2>&1 | tee protocol-verification.log
      - name: Detect Close mutations in isolated source trees
        run: python3 scripts/run-close-mutations.py --output artifacts/close-mutations/ci
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-verification
          path: |
            protocol-verification.log
            artifacts/dafny/
            artifacts/close-mutations/

  contract-change-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compare actual PR target merge base with source head
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$PR_BASE_SHA"
          python3 scripts/report-contract-changes.py --target "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --output artifacts/pdd/contract-changes.md
          echo 'Contract changes require semantic review; see the contract-change-report artifact for revisions and full source diff.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: contract-change-report
          path: artifacts/pdd/contract-changes.md
          if-no-files-found: error

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/main/WebsocketClientLite.sln

      - name: Build (Release, all target frameworks)
        run: dotnet build src/main/WebsocketClientLite.sln --configuration Release --no-restore

      - name: Test across all target frameworks (netstandard2.0 .. net10.0)
        run: ./test-all-tfms.sh Release

      - name: Collect code coverage
        run: >-
          dotnet test src/main/WebsocketClientLiteTest/WebsocketClientLiteTest.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Check coverage threshold
        run: ./scripts/check-coverage.sh ./coverage 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
