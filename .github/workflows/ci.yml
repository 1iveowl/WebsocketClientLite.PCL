name: CI

# Automatic CI follows the release trigger; routine changes are validated locally.
on:
  push:
    branches:
      - "releases/**"
    paths:
      - "GitVersion.yml"
  pull_request:
    branches:
      - "releases/**"
    paths:
      - "GitVersion.yml"
  workflow_dispatch:

env:
  PDD_PR_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  verify-protocol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Capture protocol verification and mutation evidence
        run: ./scripts/pdd.sh capture --job protocol --output artifacts/pdd/protocol
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdd-protocol
          path: artifacts/pdd/protocol/
          if-no-files-found: error
      - name: Upload generated-code audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-verification
          path: artifacts/dafny/

  contract-change-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compare actual PR target merge base with source head
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$PR_BASE_SHA"
          ./scripts/pdd.sh contract-report --target "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --output artifacts/pdd/contract-changes.md
          echo 'Contract changes require semantic review; see the contract-change-report artifact for revisions and full source diff.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: contract-change-report
          path: artifacts/pdd/contract-changes.md
          if-no-files-found: error

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build, test matrix and coverage with evidence
        run: ./scripts/pdd.sh capture --job tests --output artifacts/pdd/tests
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdd-tests
          path: artifacts/pdd/tests/
          if-no-files-found: error

  controlled-close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Detect isolated disposal ordering defect
        run: ./scripts/pdd.sh capture --job controlled --output artifacts/pdd/controlled --command-budget 480
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdd-controlled
          path: artifacts/pdd/controlled/
          if-no-files-found: error

  stryker-close:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Capture separate Close mutation evidence
        run: ./scripts/pdd.sh capture --job stryker --output artifacts/pdd/stryker --command-budget 1800
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdd-stryker
          path: artifacts/pdd/stryker/
          if-no-files-found: error

  evidence-gate:
    if: always()
    needs: [verify-protocol, build-and-test, controlled-close, stryker-close]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download available evidence
        uses: actions/download-artifact@v4
        with:
          pattern: pdd-*
          path: artifacts/pdd/downloads
      - name: Assemble and gate evidence
        if: always()
        run: |
          mkdir -p artifacts/pdd
          if [ -d artifacts/pdd/downloads/pdd-protocol ]; then mv artifacts/pdd/downloads/pdd-protocol artifacts/pdd/protocol; fi
          if [ -d artifacts/pdd/downloads/pdd-tests ]; then mv artifacts/pdd/downloads/pdd-tests artifacts/pdd/tests; fi
          if [ -d artifacts/pdd/downloads/pdd-controlled ]; then mv artifacts/pdd/downloads/pdd-controlled artifacts/pdd/controlled; fi
          if [ -d artifacts/pdd/downloads/pdd-stryker ]; then mv artifacts/pdd/downloads/pdd-stryker artifacts/pdd/stryker; fi
          ./scripts/pdd.sh aggregate
      - name: Upload receipt and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdd-receipt
          path: |
            artifacts/pdd/receipt.json
            artifacts/pdd/summary.md
            artifacts/pdd/protocol/
            artifacts/pdd/tests/
            artifacts/pdd/controlled/
            artifacts/pdd/stryker/
          if-no-files-found: error
