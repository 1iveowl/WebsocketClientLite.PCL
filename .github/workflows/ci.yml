name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/main/WebsocketClientLite.sln

      - name: Build (Release, all target frameworks)
        run: dotnet build src/main/WebsocketClientLite.sln --configuration Release --no-restore

      - name: Test across all target frameworks (netstandard2.0 .. net10.0)
        run: ./test-all-tfms.sh Release

      - name: Collect code coverage
        run: >-
          dotnet test src/main/WebsocketClientLiteTest/WebsocketClientLiteTest.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Check coverage threshold
        run: ./scripts/check-coverage.sh ./coverage 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
