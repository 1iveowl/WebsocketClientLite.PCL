name: Publish Package

on:
  push:
    branches:
      - "releases/**"
    paths:
    - "GitVersion.yml"
  pull_request:
    branches:
      - "releases/**"
    paths:
      - "GitVersion.yml"
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install gitversion
        uses: gittools/actions/gitversion/setup@v0.11.0
        with:
          versionSpec: "5.x"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.11.0
        with:
          useConfigFile: true

      - name: Restore
        run: dotnet restore
        working-directory: src/main/

      - name: Build .NET
        run: dotnet build WebsocketClientLite.sln --configuration release /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }} /p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.InformationalVersion }} --no-restore
        working-directory: src/main/

      - name: Test .NET
        run: dotnet test WebsocketClientLite.sln --configuration release --no-build --verbosity normal
        working-directory: src/main/

      - name: Pack WebsocketClientLite
        run: dotnet pack WebsocketClientLite.csproj -c Release --no-build /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}
        working-directory: src/main/WebsocketClientLite/

      - name: Pack IWebsocketClientLite (Interface)
        run: dotnet pack IWebsocketClientLite.csproj -c Release --no-build /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}
        working-directory: src/interface/IWebsocketClientLite/

      - name: Prep GitHub Packages
        run: dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish WebsocketClientLite to GitHub packages
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate
        working-directory: src/main/WebsocketClientLite/bin/Release/

      - name: Publish IWebsocketClientLite (interface) to GitHub packages
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate
        working-directory: src/interface/IWebsocketClientLite/bin/Release/

      - name: Pack WebsocketClientLite for NuGet.org
        run: dotnet pack WebsocketClientLite.csproj -c Release --no-build /p:PackageID="WebsocketClientLite.PCL" /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}
        working-directory: src/main/WebsocketClientLite/

      - name: Publish WebsocketClientLite to Nuget.Org
        run: dotnet nuget push WebsocketClientLite.PCL.*.nupkg --api-key ${{ secrets.NUGET_TOKEN }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: src/main/WebsocketClientLite/bin/Release/

      - name: Publish IWebsocketClientLite (interface) to Nuget.Org
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.NUGET_TOKEN }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: src/interface/IWebsocketClientLite/bin/Release/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.gitversion.outputs.AssemblySemVer }}
          release_name: Release ${{ steps.gitversion.outputs.AssemblySemVer }}
          body: |
            WebsocketClientLite 9.0.2 – Highlights

            - Fixes a race in the 9.0.1 close-on-unsubscribe behavior: disposing the
              subscription immediately after WebsocketConnected could skip the close
              handshake. The close hook is now registered before WebsocketConnected is
              emitted and runs on every teardown path. Use 9.0.2 instead of 9.0.1.

            Includes all 9.0.1 changes:

            Bug fixes
            - Unsubscribing from the connection observable now sends the RFC 6455 close
              handshake (best-effort, exactly once) instead of just dropping the TCP
              connection.
            - A failed handshake (e.g. HTTP 404) now fails fast with the server's status
              code instead of reporting an internal success state and waiting out the
              handshake timeout.
            - Send failures now throw WebsocketClientLiteException at the await site, in
              addition to reporting SendError on the status channel.
            - The final Disconnected status is delivered (Rx-grammar fix in the status
              callbacks).
            - A Close frame received mid-fragmentation cleanly aborts the message and the
              read loop no longer runs into EOF after a close.
            - Disposing the client while a connection is active no longer throws from
              teardown.
            - NuGet packaging: the interface assembly is no longer bundled into
              lib/netstandard2.0/2.1 alongside the IWebsocketClientLite dependency.

            New
            - ClientWebSocketRx.NegotiatedSubprotocols exposes the subprotocol(s) the
              server accepted during the handshake.

            Notes
            - A user-supplied TcpClient can only serve the first connection; leave
              TcpClient unset when using reconnect patterns (Retry/Repeat). The console
              sample and README have been updated accordingly.
          draft: true
          prerelease: true
