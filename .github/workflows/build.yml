name: Publish Package

on:
  push:
    branches:
      - "releases/**"
    paths:
    - "GitVersion.yml"
  pull_request:
    branches:
      - "releases/**"
    paths:
      - "GitVersion.yml"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  packages: write # push to GitHub Packages
  id-token: write # OIDC token for NuGet.org Trusted Publishing

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Install gitversion
        uses: gittools/actions/gitversion/setup@v0.11.0
        with:
          versionSpec: "5.x"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.11.0
        with:
          useConfigFile: true

      # The release text is the CHANGELOG's "New in Version <x.y.z>" section for this
      # version. It runs before anything is built or published, so a release without
      # that section stops here instead of after the packages reach NuGet.org.
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ steps.gitversion.outputs.MajorMinorPatch }}
        run: |
          awk -v heading="## New in Version ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## New in Version ${VERSION}' section. Add it before releasing."
            exit 1
          fi
          cat release-notes.md

      - name: Restore
        run: dotnet restore
        working-directory: src/main/

      - name: Build .NET
        run: dotnet build WebsocketClientLite.sln --configuration release /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }} /p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.InformationalVersion }} --no-restore
        working-directory: src/main/

      - name: Test .NET
        run: dotnet test WebsocketClientLite.sln --configuration release --no-build --verbosity normal
        working-directory: src/main/

      - name: Pack WebsocketClientLite
        run: dotnet pack WebsocketClientLite.csproj -c Release --no-build /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}
        working-directory: src/main/WebsocketClientLite/

      - name: Pack IWebsocketClientLite (Interface)
        run: dotnet pack IWebsocketClientLite.csproj -c Release --no-build /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}
        working-directory: src/interface/IWebsocketClientLite/

      - name: Prep GitHub Packages
        run: dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish WebsocketClientLite to GitHub packages
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate
        working-directory: src/main/WebsocketClientLite/bin/Release/

      - name: Publish IWebsocketClientLite (interface) to GitHub packages
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate
        working-directory: src/interface/IWebsocketClientLite/bin/Release/

      - name: Pack WebsocketClientLite for NuGet.org
        run: dotnet pack WebsocketClientLite.csproj -c Release --no-build /p:PackageID="WebsocketClientLite.PCL" /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}
        working-directory: src/main/WebsocketClientLite/

      # Trusted Publishing: exchanges this run's GitHub OIDC token for a
      # short-lived NuGet.org API key. Requires a Trusted Publishing policy on
      # NuGet.org (owner profile -> Trusted Publishing) matching this repository
      # and workflow file name (build.yml). No long-lived NUGET_TOKEN secret.
      # The user is the NuGet.org profile that owns the Trusted Publishing
      # policies. A NuGet.org username is public, so it lives inline rather
      # than in a secret.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: 1iveowl

      - name: Publish WebsocketClientLite to Nuget.Org
        run: dotnet nuget push WebsocketClientLite.PCL.*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: src/main/WebsocketClientLite/bin/Release/

      - name: Publish IWebsocketClientLite (interface) to Nuget.Org
        run: dotnet nuget push "*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: src/interface/IWebsocketClientLite/bin/Release/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.gitversion.outputs.AssemblySemVer }}
          release_name: Release ${{ steps.gitversion.outputs.AssemblySemVer }}
          body_path: release-notes.md
          draft: true
          prerelease: true
