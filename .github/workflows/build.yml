name: Publish Package

on:
  push:
    branches:
      - "releases/**"
    paths:
    - "GitVersion.yml"
  pull_request:
    branches:
      - "releases/**"
    paths:
      - "GitVersion.yml"
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install gitversion
        uses: gittools/actions/gitversion/setup@v0.11.0
        with:
          versionSpec: "5.x"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.11.0
        with:
          useConfigFile: true

      - name: Restore
        run: dotnet restore
        working-directory: src/main/

      - name: Build .NET
        run: dotnet build WebsocketClientLite.sln --configuration release /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }} /p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.InformationalVersion }} --no-restore
        working-directory: src/main/

      - name: Test .NET
        run: dotnet test WebsocketClientLite.sln --configuration release --no-build --verbosity normal
        working-directory: src/main/

      - name: Pack WebsocketClientLite
        run: dotnet pack WebsocketClientLite.csproj -c Release --no-build /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}
        working-directory: src/main/WebsocketClientLite/

      - name: Pack IWebsocketClientLite (Interface)
        run: dotnet pack IWebsocketClientLite.csproj -c Release --no-build /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}
        working-directory: src/interface/IWebsocketClientLite/

      - name: Prep GitHub Packages
        run: dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish WebsocketClientLite to GitHub packages
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate
        working-directory: src/main/WebsocketClientLite/bin/Release/

      - name: Publish IWebsocketClientLite (interface) to GitHub packages
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate
        working-directory: src/interface/IWebsocketClientLite/bin/Release/

      - name: Pack WebsocketClientLite for NuGet.org
        run: dotnet pack WebsocketClientLite.csproj -c Release --no-build /p:PackageID="WebsocketClientLite.PCL" /p:Version=${{ steps.gitversion.outputs.MajorMinorPatch }}
        working-directory: src/main/WebsocketClientLite/

      - name: Publish WebsocketClientLite to Nuget.Org
        run: dotnet nuget push WebsocketClientLite.PCL.*.nupkg --api-key ${{ secrets.NUGET_TOKEN }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: src/main/WebsocketClientLite/bin/Release/

      - name: Publish IWebsocketClientLite (interface) to Nuget.Org
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.NUGET_TOKEN }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: src/interface/IWebsocketClientLite/bin/Release/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.gitversion.outputs.AssemblySemVer }}
          release_name: Release ${{ steps.gitversion.outputs.AssemblySemVer }}
          body: |
            WebsocketClientLite 9.0.0 – Highlights

            Bug fixes
            - Subprotocols are now actually sent in the handshake (Sec-WebSocket-Protocol).
            - Close status codes are sent big-endian per RFC 6455.
            - ExcludeZeroApplicationDataInPong is now honored (Slack RTM).
            - The CancellationToken passed to WebsocketConnectObservable is forwarded.
            - Fragmented messages reassemble correctly on .NET 8/9/10 and .NET Standard 2.1.
            - Writes to the connection are serialized, fixing mid-stream disconnects when
              client pings interleave with sends.

            Security hardening
            - Configurable MaxFrameSize (default 16 MiB) caps incoming frames and reassembled
              messages to guard against memory-exhaustion from a malicious server.
            - Control frames are validated (<=125 bytes, not fragmented) per RFC 6455 §5.5.
            - Handshake header/origin/subprotocol values containing CR/LF/NUL are rejected.
            - CheckCertificateRevocation option (default true) enables TLS revocation checking.

            Performance
            - Receive path reads each payload once and unmasks in place (no MemoryStream,
              far fewer allocations); frames are read from a single subscription.
            - Send path avoids per-frame mask-key and text-encoding allocations.

            Breaking changes
            - ClientWebSocketRx is now a class instead of a record, and its TcpClient
              property is nullable.
            - CheckCertificateRevocation defaults to true; set it to false if your
              environment cannot reach OCSP/CRL endpoints.

            Tooling
            - Tests run against every target framework (netstandard2.0..net10) and a CI
              workflow builds, tests, and gates code coverage.
          draft: true
          prerelease: true
